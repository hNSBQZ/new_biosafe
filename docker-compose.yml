name: new-biosafe

services:
  biosafe:
    build: .
    container_name: new-biosafe
    env_file:
      - .env
    volumes:
      - biosafe-data:/app/data
      - biosafe-logs:/app/logs
    ports:
      - "127.0.0.1:8192:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  biosafe-data:
    name: biosafe-data
  biosafe-logs:
    name: biosafe-logs
