[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "new-biosafe"
version = "0.1.0"
description = "Biosafety web voice assistant"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<3",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["biosafe*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
